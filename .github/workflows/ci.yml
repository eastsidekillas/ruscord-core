name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: ruscord
          POSTGRES_PASSWORD: ruscord
          POSTGRES_DB: ruscord_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ruscord -d ruscord_test"
          --health-interval 5s --health-retries 10
    env:
      RUSCORD_TEST_POSTGRES_URL: postgres://ruscord:ruscord@127.0.0.1:5432/ruscord_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/ruscord

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate .env
        run: ./scripts/gen-env.sh > .env
      - name: validate compose file
        run: docker compose --env-file .env -f deploy/docker-compose.yml --profile app config --quiet
      - name: start stack and check readiness
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml --profile app up -d --build --wait --wait-timeout 180 postgres valkey
          docker compose --env-file .env -f deploy/docker-compose.yml --profile app up -d --build nats livekit seaweedfs app
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then ready=1; break; fi
            sleep 2
          done
          if [ -z "${ready:-}" ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs
            exit 1
          fi
      - name: register, create a guild and join it by invite through the running stack
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","username":"ci_user","password":"ci-password-1"}' \
            http://127.0.0.1:8080/api/v1/auth/register
          curl -fsS -b jar http://127.0.0.1:8080/api/v1/users/@me | grep -q '"username":"ci_user"'
          api=http://127.0.0.1:8080/api/v1
          json='Content-Type: application/json'
          guild=$(curl -fsS -b jar -H "$json" -d '{"name":"CI guild"}' $api/guilds)
          channel=$(echo "$guild" | jq -r '.channels[0].id')
          curl -fsS -b jar $api/users/@me/guilds | grep -q '"name":"CI guild"'
          code=$(curl -fsS -b jar -H "$json" -d '{}' $api/channels/$channel/invites | jq -r .code)
          curl -fsS -c jar2 -H "$json" \
            -d '{"email":"ci2@example.com","username":"ci_user2","password":"ci-password-2"}' $api/auth/register
          curl -fsS -b jar2 -X POST $api/invites/$code | jq -e '.member.user_id' >/dev/null
          curl -fsS -b jar -H "$json" -d '{"username":"ci_user2"}' $api/users/@me/relationships
          user1=$(curl -fsS -b jar $api/users/@me | jq -r .id)
          curl -fsS -b jar2 -X PUT -H "$json" -d '{}' $api/users/@me/relationships/$user1
          curl -fsS -b jar2 $api/users/@me/relationships | jq -e '.[0].type == 1' >/dev/null
          dm=$(curl -fsS -b jar2 -H "$json" -d "{\"recipient_id\":\"$user1\"}" $api/users/@me/channels | jq -r .id)
          curl -fsS -b jar2 -H "$json" -d '{"content":"привет","nonce":"ci-1"}' $api/channels/$dm/messages >/dev/null
          curl -fsS -b jar $api/channels/$dm/messages | jq -e '.[0].content == "привет"' >/dev/null
          curl -fsS -b jar -H "$json" -d '{"content":"в канале"}' $api/channels/$channel/messages >/dev/null
          curl -fsS -b jar2 $api/channels/$channel/messages | jq -e 'length == 1' >/dev/null
      - name: upload an avatar and a guild icon to SeaweedFS and fetch them back
        run: |
          api=http://127.0.0.1:8080/api/v1
          pic=internal/platform/imaging/testdata/alpha.png
          avatar=$(curl -fsS -b jar -X PUT --data-binary @$pic $api/users/@me/avatar | jq -r .avatar)
          case "$avatar" in /cdn/avatars/*.png) ;; *) echo "avatar: $avatar"; exit 1;; esac
          curl -fsS -D headers -o got.png http://127.0.0.1:8080$avatar
          grep -qi '^content-type: image/png' headers
          grep -qi '^x-content-type-options: nosniff' headers
          file got.png | grep -q 'PNG image data, 256 x 256'
          guild=$(curl -fsS -b jar $api/users/@me/guilds | jq -r '.[0].id')
          icon=$(curl -fsS -b jar -X PUT --data-binary @$pic $api/guilds/$guild/icon | jq -r .icon)
          curl -fsS -o /dev/null http://127.0.0.1:8080$icon
          curl -fsS -b jar2 $api/users/$(curl -fsS -b jar $api/users/@me | jq -r .id)/profile | jq -e ".user.avatar == \"$avatar\"" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar -X PUT --data-binary '<svg/>' $api/users/@me/avatar)" = 422
      - name: outbox events reach JetStream
        run: |
          for i in $(seq 1 10); do
            msgs=$(curl -fsS 'http://127.0.0.1:8222/jsz?streams=true' | jq '[.account_details[].stream_detail[] | select(.name=="EVENTS") | .state.messages] | add // 0')
            if [ "$msgs" -ge 10 ]; then echo "EVENTS has $msgs messages"; exit 0; fi
            sleep 1
          done
          echo "EVENTS stream has ${msgs:-0} messages"; exit 1
