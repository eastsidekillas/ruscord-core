# Test server (staging) on one VPS: layered over the shared stack. Use
# `make staging-up`; Make adds local LiveKit overlays only in local mode.
# What differs and why: docs/adr/0033-staging.md,
# step by step: docs/deploy-staging.md.
#
# Public: Caddy on 80/443 (HTTPS by Let's Encrypt) in front of the client nginx.
# The client proxies /api, /gateway, /cdn and local /livekit signalling; the
# webhook path is routed by Caddy directly to Core. In local mode, LiveKit
# media uses 7882/udp and 7881/tcp. Cloud mode has no local LiveKit container.
name: ruscord

services:
  app:
    environment:
      RUSCORD_ENV: staging
      RUSCORD_LOG_LEVEL: info
      RUSCORD_ALLOWED_ORIGINS: https://${RUSCORD_DOMAIN:?set RUSCORD_DOMAIN in .env}
      # One node: migrations run on start (ADR-0033).
      RUSCORD_AUTO_MIGRATE: "true"
    restart: unless-stopped

  web:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
  valkey:
    restart: unless-stopped
  nats:
    restart: unless-stopped
  seaweedfs:
    restart: unless-stopped

  caddy:
    # HTTPS for the site: Caddy gets and renews the Let's Encrypt
    # certificate for RUSCORD_DOMAIN by itself and proxies to the client's
    # nginx (websockets included).
    profiles: ["staging"]
    image: caddy:2.10.0-alpine
    environment:
      RUSCORD_DOMAIN: ${RUSCORD_DOMAIN:?set RUSCORD_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    volumes:
      # Relative to deploy/, the folder of the first compose file.
      - ./staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
