# Staging overrides for self-hosted LiveKit. Included only in local mode.
name: ruscord

services:
  livekit:
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: ${RUSCORD_LIVEKIT_EXTERNAL_IP:-true}
          node_ip: ${RUSCORD_LIVEKIT_NODE_IP:-}
        room:
          empty_timeout: 30
          max_participants: 50
        logging:
          level: info
        webhook:
          api_key: ${RUSCORD_LIVEKIT_API_KEY}
          urls:
            - http://core:8080/livekit/webhook
    ports: !override
      - "7881:7881"          # ICE over TCP, when UDP does not get through
      - "7882:7882/udp"      # media
    restart: unless-stopped
