# LiveKit for local development only. Production config lives in
# docs/architecture.md#livekit-production and differs in TURN, TLS, webhooks
# and host networking.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  node_ip: 127.0.0.1
  use_external_ip: false
room:
  empty_timeout: 30
  max_participants: 50
logging:
  level: info
# API keys come from the LIVEKIT_KEYS environment variable (see docker-compose.yml).
